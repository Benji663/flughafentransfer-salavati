<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Vielen Dank – Flughafentransfer Salavati</title>

    <meta
        name="description"
        content="Vielen Dank für Ihre Reservierungsanfrage beim Flughafentransfer Salavati."
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .thankyou-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #f7f5f1;
        }

        .thankyou-card {
            width: 100%;
            max-width: 720px;
            background: #ffffff;
            border: 1px solid #e4e0d8;
            border-radius: 24px;
            padding: 60px 50px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(20, 30, 40, 0.08);
        }

        .thankyou-logo {
            width: 90px;
            height: auto;
            margin: 0 auto 30px;
            display: block;
        }

        .thankyou-check {
            width: 64px;
            height: 64px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #c89b3c;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
        }

        .thankyou-card h1 {
            margin: 0 0 18px;
            font-family: "Montserrat", sans-serif;
            font-size: clamp(34px, 5vw, 54px);
            line-height: 1.08;
            font-weight: 800;
            color: #101820;
        }

        .thankyou-card h1 span {
            color: #c89b3c;
        }

        .thankyou-card p {
            max-width: 560px;
            margin: 0 auto 12px;
            font-family: "DM Sans", sans-serif;
            font-size: 17px;
            line-height: 1.7;
            color: #526979;
        }

        .thankyou-note {
            margin-top: 25px !important;
            font-size: 15px !important;
        }

        .thankyou-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 30px;
            padding: 15px 28px;
            border-radius: 10px;
            background: #101820;
            color: #ffffff;
            text-decoration: none;
            font-family: "DM Sans", sans-serif;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .thankyou-button:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        @media (max-width: 600px) {

            .thankyou-page {
                padding: 25px 15px;
            }

            .thankyou-card {
                padding: 45px 25px;
                border-radius: 18px;
            }

            .thankyou-logo {
                width: 75px;
            }

        }

    </style>

</head>


<body>

    <main class="thankyou-page">

        <div class="thankyou-card">

            <img
                src="Logo Flughafentransfer.png"
                alt="Flughafentransfer Salavati"
                class="thankyou-logo"
            >

            <div class="thankyou-check">
                ✓
            </div>

            <h1>
                Vielen Dank!
                <br>
                <span>Ihre Anfrage ist angekommen.</span>
            </h1>

            <p>
                Wir haben Ihre Reservierungsanfrage erhalten
                und melden uns persönlich bei Ihnen zur
                Bestätigung Ihrer Fahrt.
            </p>

            <p class="thankyou-note">
                Bitte beachten Sie: Die Vorbestellung ist erst
                nach unserer persönlichen Bestätigung verbindlich.
            </p>

            <a
                href="index.html"
                class="thankyou-button"
            >
                ← Zurück zur Startseite
            </a>

        </div>

    </main>

</body>

</html>
